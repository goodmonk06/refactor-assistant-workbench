version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: refactor_workbench_db
    environment:
      POSTGRES_USER: refactor
      POSTGRES_PASSWORD: refactor123
      POSTGRES_DB: refactor_workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refactor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - refactor_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: refactor_workbench_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://refactor:refactor123@postgres:5432/refactor_workbench?schema=public"
      PORT: 3001
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - refactor_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: refactor_workbench_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    depends_on:
      - backend
    networks:
      - refactor_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  refactor_network:
    driver: bridge
