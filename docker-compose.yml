version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: refactor_workbench_db
    environment:
      POSTGRES_USER: refactor
      POSTGRES_PASSWORD: refactor123
      POSTGRES_DB: refactor_workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refactor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
